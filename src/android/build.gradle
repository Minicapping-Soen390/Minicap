// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        kotlinVersion = "1.8.0"
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral() {
            // Configure timeout for maven central
            content {
                includeGroupByRegex ".*"
            }
        }
        maven {
            url 'https://jitpack.io'
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        maven {
            url "$rootDir/../node_modules/expo/android/maven"
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.3.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
    
    configurations.all {
        // Remove the problematic attribute settings
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral() {
            // Configure timeout for maven central
            content {
                includeGroupByRegex ".*"
            }
        }
        maven {
            url 'https://jitpack.io'
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        maven {
            url "$rootDir/../node_modules/expo/android/maven"
        }
    }
    
    configurations.all {
        resolutionStrategy {
            // Force specific versions to avoid conflicts
            force 'com.google.errorprone:error_prone_annotations:2.11.0'
            force 'org.bitbucket.b_c:jose4j:0.7.9'
            // Cache dependencies for 1 day
            cacheDynamicVersionsFor 24, 'hours'
            cacheChangingModulesFor 24, 'hours'
        }
        
        // Remove the problematic attribute settings
    }
}

// Enable offline mode
gradle.startParameter.offline = true

// Explicitly define the offline mode task
task offlineMode() {
    doFirst {
        println "Running in offline mode"
    }
}

// Make all compile and generate tasks depend on offlineMode
tasks.whenTaskAdded { task ->
    if (task.name.contains('compile') || task.name.contains('generate')) {
        task.dependsOn('offlineMode')
    }
}

// Set caching for offline mode
allprojects {
    buildscript {
        configurations.all {
            resolutionStrategy {
                cacheChangingModulesFor 0, 'seconds'
            }
        }
    }
    configurations.all {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }
}
